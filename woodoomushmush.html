import * as THREE from 'three';

import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';

import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const PI=Math.PI,canvas=document.getElementById('c'),fadeEl=document.getElementById('fade');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();

const _V3=p=>{
  if(p instanceof THREE.Vector3)return p.clone();
  if(Array.isArray(p)&&p.length>=3)return new THREE.Vector3(p[0],p[1],p[2]);
  if(p&&typeof p.x==='number')return new THREE.Vector3(p.x,p.y,p.z);
  return new THREE.Vector3(0,0,0);};
const makeCurve=(pts,closed=false,mode='centripetal')=>new THREE.CatmullRomCurve3(pts.map(_V3),closed,mode);

function texFrom(draw,w=256,h=256){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}

function createSkinTexture(baseColor,variation){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=baseColor;ctx.fillRect(0,0,512,512);
  const imageData=ctx.getImageData(0,0,512,512);const data=imageData.data;
  for(let i=0;i<data.length;i+=4){
    const noise=(Math.random()-0.5)*variation;
    data[i]=Math.max(0,Math.min(255,data[i]+noise));
    data[i+1]=Math.max(0,Math.min(255,data[i+1]+noise));
    data[i+2]=Math.max(0,Math.min(255,data[i+2]+noise));}
  ctx.putImageData(imageData,0,0);
  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;
  texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=8;
  return texture;}

function createNormalMap(){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#8080ff';ctx.fillRect(0,0,512,512);
  const imageData=ctx.getImageData(0,0,512,512);const data=imageData.data;
  for(let i=0;i<data.length;i+=4){
    const nx=(Math.random()-0.5)*20;const ny=(Math.random()-0.5)*20;
    data[i]=128+nx;data[i+1]=128+ny;data[i+2]=255;}
  ctx.putImageData(imageData,0,0);
  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;
  return texture;}

const SKIN_TEX=createSkinTexture('#3D2415',18);
const SKIN_HI_TEX=createSkinTexture('#4A2E1C',15);
const SKIN_NORMAL=createNormalMap();

function canvasTex(){
  return texFrom((g,w,h)=>{
    g.fillStyle='#c9b998';g.fillRect(0,0,w,h);
    let d=11;const rn=()=>{d=(d*1103515245+12345)&0x7fffffff;return d/0x7fffffff;};
    for(let i=0;i<9000;i++){
      const v=rn();
      g.fillStyle=v<.5?`rgba(118,100,72,${.04+rn()*.08})`:`rgba(246,236,214,${.04+rn()*.08})`;
      g.fillRect(rn()*w,rn()*h,1+rn()*2,1+rn()*2);}
    for(let y=0;y<h;y+=4){
      g.strokeStyle=`rgba(102,86,60,${.10+rn()*.08})`;g.lineWidth=1;
      g.beginPath();g.moveTo(0,y+rn()*1.5);g.lineTo(w,y+rn()*1.5);g.stroke();}
    for(let x=0;x<w;x+=4){
      g.strokeStyle=`rgba(152,132,100,${.08+rn()*.07})`;g.lineWidth=1;
      g.beginPath();g.moveTo(x+rn()*1.5,0);g.lineTo(x+rn()*1.5,h);g.stroke();}
    for(let i=0;i<140;i++){
      g.fillStyle=`rgba(105,88,62,${.10+rn()*.12})`;
      g.fillRect(rn()*w,rn()*h,3+rn()*8,1+rn()*2);}
  },512,512);}

function veveTex(){
  return texFrom((g,w,h)=>{
    g.clearRect(0,0,w,h);const cx=w/2,cy=h/2,Rr=w*.44;
    g.strokeStyle='#ffcf8e';g.lineWidth=w*.0055;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.arc(cx,cy,Rr,0,7);g.stroke();
    g.setLineDash([w*.014,w*.016]);g.lineWidth=w*.004;
    g.beginPath();g.arc(cx,cy,Rr*.93,0,7);g.stroke();g.setLineDash([]);
    g.lineWidth=w*.0075;
    g.beginPath();g.moveTo(cx,cy-Rr*.74);g.lineTo(cx,cy+Rr*.74);
    g.moveTo(cx-Rr*.64,cy);g.lineTo(cx+Rr*.64,cy);g.stroke();
    for(const s of[-1,1]){
      g.beginPath();g.moveTo(cx,cy-Rr*.20);
      g.quadraticCurveTo(cx+s*Rr*.46,cy-Rr*.30,cx+s*Rr*.40,cy+Rr*.10);
      g.quadraticCurveTo(cx+s*Rr*.30,cy+Rr*.34,cx,cy+Rr*.20);g.stroke();
      g.beginPath();g.moveTo(cx+s*Rr*.64,cy-Rr*.30);g.lineTo(cx+s*Rr*.80,cy-Rr*.46);g.stroke();
      g.beginPath();g.arc(cx+s*Rr*.80,cy-Rr*.50,w*.016,0,7);g.stroke();}
    const heart=(x,y,r)=>{g.beginPath();g.moveTo(x,y+r*.7);
      g.bezierCurveTo(x-r*1.1,y-r*.25,x-r*.5,y-r*1.05,x,y-r*.42);
      g.bezierCurveTo(x+r*.5,y-r*1.05,x+r*1.1,y-r*.25,x,y+r*.7);g.stroke();};
    heart(cx,cy,Rr*.20);
    g.beginPath();g.arc(cx,cy,Rr*.30,0,7);g.stroke();
  },512,512);}

function stoneTex(){
  return texFrom((g,w,h)=>{
    g.fillStyle='#191620';g.fillRect(0,0,w,h);
    let d=5;const rn=()=>{d=(d*1103515245+12345)&0x7fffffff;return d/0x7fffffff;};
    for(let i=0;i<22000;i++){const v=rn();
      g.fillStyle=`rgba(${90+v*70|0},${80+v*60|0},${95+v*70|0},${.05+rn()*.13})`;
      g.fillRect(rn()*w,rn()*h,1+rn()*4,1+rn()*4);}
    g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;
    for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*w/4,0);g.lineTo(i*w/4,h);g.stroke();
      g.beginPath();g.moveTo(0,i*h/4);g.lineTo(w,i*h/4);g.stroke();}
  },512,512);}

function mushroomWorldFloorTex(){
  return texFrom((g,w,h)=>{
    g.fillStyle='#240b36'; // Глубокий фиолетовый базовый цвет
    g.fillRect(0,0,w,h);
    let d=17;const rn=()=>{d=(d*1103515245+12345)&0x7fffffff;return d/0x7fffffff;};
    for(let i=0;i<15000;i++){
      const v=rn();
      // Фиолетовые и пурпурные переливы
      g.fillStyle=`rgba(${100+v*100|0},${40+v*60|0},${160+v*95|0},${.1+rn()*.25})`;
      g.fillRect(rn()*w,rn()*h,1+rn()*4,1+rn()*4);
    }
    for(let i=0;i<400;i++){
      // Светящиеся фиолетовые пятна (биолюминесценция)
      g.fillStyle=`rgba(${180+rn()*75|0},${80+rn()*80|0},${220+rn()*35|0},${.25+rn()*.45})`;
      g.beginPath();
      g.ellipse(rn()*w,rn()*h,5+rn()*12,4+rn()*8,rn()*PI,0,PI*2);
      g.fill();
    }
  },512,512);
}

function softSprite(warm){
  return texFrom((g,w,h)=>{
    const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    if(warm){r.addColorStop(0,'rgba(255,236,196,1)');r.addColorStop(.28,'rgba(255,176,86,.55)');}
    else{r.addColorStop(0,'rgba(255,255,255,.85)');r.addColorStop(.3,'rgba(220,228,240,.4)');}
    r.addColorStop(.72,'rgba(255,255,255,.07)');r.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=r;g.fillRect(0,0,w,h);
  },128,128);}

function grid(pos,uv,idx,ri,rj){
  for(let i=0;i<ri;i++)for(let j=0;j<rj;j++){
    const a=i*(rj+1)+j,b=a+rj+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();return g;}

function loftY(prof,radial=54,N=170,mod=null){
  const cv=makeCurve(prof.map(p=>[p[0],p[1],p[2]]));
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=N;i++){
    const t=i/N,q=cv.getPoint(t),y=q.x;
    const rx=Math.max(1e-4,q.y),rz=Math.max(1e-4,q.z);
    for(let j=0;j<=radial;j++){
      const th=j/radial*PI*2,m=mod?mod(th,y):1,c=Math.cos(th),s=Math.sin(th);
      pos.push(c*rx*m,y,s*rz*m);uv.push(j/radial,t);}}
  return grid(pos,uv,idx,N,radial);}

function loftPath(pts,radFn,N=140,radial=28){
  const vecPts=pts.map(_V3);
  if(vecPts.length<2)return new THREE.BufferGeometry();
  const cleanPts=[vecPts[0]];
  for(let i=1;i<vecPts.length;i++){
    if(vecPts[i].distanceToSquared(cleanPts[cleanPts.length-1])>1e-8)cleanPts.push(vecPts[i]);}
  if(cleanPts.length<2)return new THREE.BufferGeometry();
  const cv=new THREE.CatmullRomCurve3(cleanPts,false,'centripetal');
  let fr;
  try{fr=cv.computeFrenetFrames(N,false);}catch(e){
    fr={normals:[],binormals:[]};
    const up=new THREE.Vector3(0,1,0);
    for(let i=0;i<=N;i++){
      const u=i/N;let tg;
      try{tg=cv.getTangentAt(u);}catch(err){tg=new THREE.Vector3(0,1,0);}
      if(tg.lengthSq()<1e-6)tg.set(0,1,0);
      const nr=new THREE.Vector3().crossVectors(up,tg);
      if(nr.lengthSq()<1e-6)nr.set(1,0,0);else nr.normalize();
      const bn=new THREE.Vector3().crossVectors(tg,nr).normalize();
      fr.normals.push(nr);fr.binormals.push(bn);}}
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=N;i++){
    const u=i/N;let p;
    try{p=cv.getPointAt(u);}catch(err){p=cleanPts[0].clone();}
    const r=radFn(u);
    const rx=Array.isArray(r)?r[0]:r,rz=Array.isArray(r)?r[1]:r;
    const nr=fr.normals[i],bn=fr.binormals[i];
    for(let j=0;j<=radial;j++){
      const th=j/radial*PI*2;
      const c=Math.cos(th)*rx,s=Math.sin(th)*rz;
      pos.push(p.x+nr.x*c+bn.x*s,p.y+nr.y*c+bn.y*s,p.z+nr.z*c+bn.z*s);
      uv.push(j/radial,u);}}
  return grid(pos,uv,idx,N,radial);}

function kfArr(keys,t){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]),e=u*u*(3-2*u);return a[1]+(b[1]-a[1])*e;}}
  return keys[keys.length-1][1];}

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function mesh(geo,mat,pos,rot,scl){
  if(!geo||!geo.attributes||!geo.attributes.position)return new THREE.Group();
  const m=new THREE.Mesh(geo,mat);
  if(pos)m.position.set(pos[0],pos[1],pos[2]);
  if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
  if(scl)m.scale.set(scl[0],scl[1],scl[2]);
  m.castShadow=m.receiveShadow=true;return m;}

const Q=new THREE.Quaternion(),MT=new THREE.Matrix4(),EU=new THREE.Euler();
function inst(geo,mat,list){
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((o,i)=>{EU.set(o.rot?o.rot[0]:0,o.rot?o.rot[1]:0,o.rot?o.rot[2]:0);
    Q.setFromEuler(EU);
    MT.compose(V(o.p[0],o.p[1],o.p[2]),Q,V(o.s[0],o.s[1],o.s[2]));im.setMatrixAt(i,MT);});
  im.instanceMatrix.needsUpdate=true;im.castShadow=im.receiveShadow=true;return im;}

function beadsOn(curve,n,r,mat){
  const l=[];for(let i=0;i<n;i++){const p=curve.getPointAt(i/(n-1));
    l.push({p:[p.x,p.y,p.z],s:[r,r,r]});}
  const _b=inst(new THREE.SphereGeometry(1,10,8),mat,l);_b.castShadow=false;return _b;}

function addSSS(mat,hex,power){
  if(!power)return mat;
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uSSS={value:new THREE.Color(hex).multiplyScalar(power)};
    sh.fragmentShader='uniform vec3 uSSS;\n'+sh.fragmentShader.replace(
      '#include <lights_fragment_end>',
      `#include <lights_fragment_end>
       float _f=pow(1.0-saturate(dot(geometryNormal,geometryViewDir)),2.6);
       reflectedLight.indirectDiffuse+=uSSS*_f;`);};
  mat.customProgramCacheKey=()=>'sss'+mat.uuid;
  return mat;}

// ===== 5 СВЕЧЕЙ =====
const flameMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vV;
    void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);
    vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform float uTime;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
    void main(){float y=vUv.y;float sd=uTime*11.0;
      float fl=.78+.22*sin(sd)+.13*sin(sd*2.3+1.7)+.07*sin(sd*5.1);
      float core=smoothstep(0.,.20,y)*(1.-smoothstep(.30,1.,y));
      float edge=pow(abs(dot(normalize(vN),normalize(vV))),.6);
      vec3 c=mix(vec3(1.,.42,.06),vec3(1.,.94,.72),smoothstep(.0,.55,y));
      c=mix(vec3(.30,.52,1.),c,smoothstep(.0,.16,y));
      float a=core*fl*edge;gl_FragColor=vec4(c*3.4*a,a);}`});

function mushroomWorldSkyTex(){
  const w=512,h=256,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d'),gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#1a0520');gr.addColorStop(.3,'#2a0830');
  gr.addColorStop(.55,'#3a1040');gr.addColorStop(.75,'#1a0520');gr.addColorStop(1,'#0a0010');
  g.fillStyle=gr;g.fillRect(0,0,w,h);

function makeMushroom(x,z,h,capR,capColor){
  const g=new THREE.Group();
  const stem=new THREE.Mesh(
    new THREE.CylinderGeometry(capR*0.15,capR*0.2,h,16),
    new THREE.MeshStandardMaterial({color:0xd0c8b8,roughness:0.85,metalness:0})
  );
  stem.position.y=h/2;stem.castShadow=true;stem.receiveShadow=true;
  g.add(stem);
  
  const cap=new THREE.Mesh(
    new THREE.SphereGeometry(capR,24,16,0,PI*2,0,PI*0.5),
    new THREE.MeshStandardMaterial({
      color:capColor,
      roughness:0.6,
      metalness:0.1,
      emissive:capColor,
      emissiveIntensity:0.3
    })
  );
  cap.position.y=h;
  cap.scale.set(1,0.5,1);
  cap.castShadow=true;
  g.add(cap);
  
  const dots=8+Math.floor(Math.random()*6);
  for(let i=0;i<dots;i++){
    const a=Math.random()*PI*2;
    const r=capR*0.3+Math.random()*capR*0.5;
    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(capR*0.04,8,6),
      new THREE.MeshBasicMaterial({color:0xffffff})
    );
    dot.position.set(Math.cos(a)*r,h-capR*0.1,Math.sin(a)*r);
    g.add(dot);
  }
  
  g.position.set(x,0,z);
  return g;
}

const bgT1=skyTex1();
const envRT1=new THREE.PMREMGenerator(renderer).fromEquirectangular(bgT1);
scene.background=bgT1;scene.environment=envRT1.texture;scene.backgroundIntensity=1.05;scene.fog=new THREE.FogExp2(0x120c16,.08);

// ===== ВЗАИМОДЕЙСТВИЕ =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isTransitioning = false;

function switchToScene(sceneNum){
  if(isTransitioning) return;
  isTransitioning = true;
  
  fadeEl.style.opacity = '1';
  
  setTimeout(()=>{
    scene1Group.visible = sceneNum === 1;
    scene3Group.visible = sceneNum === 3;
    
    if(sceneNum === 1){
      scene.background = bgT1;
      scene.environment = envRT1.texture;
      scene.fog = new THREE.FogExp2(0x120c16, 0.08);
      key.intensity = 1.35;
      rimL.intensity = 3.0;
      rimR.intensity = 1.15;
      hemi.color.set(0x46365c);
      hemi.groundColor.set(0x181018);
    } else if(sceneNum === 3){
      scene.background = bgT3;
      scene.environment = envRT3.texture;
      scene.fog = new THREE.FogExp2(0x1a0520, 0.06);
      key.intensity = 0.5;
      rimL.intensity = 1.0;
      rimR.intensity = 0.8;
      hemi.color.set(0x6633aa);
      hemi.groundColor.set(0x1a0520);
    }
    
    currentScene = sceneNum;
    
    setTimeout(()=>{
      fadeEl.style.opacity = '0';
      setTimeout(()=>{ isTransitioning = false; }, 1200);
    }, 200);
  }, 1200);
}

window.addEventListener('click', (event) => {
  if(isTransitioning) return;
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  
  if(currentScene === 1){
    const veveIntersects = raycaster.intersectObject(veve, true);
    if (veveIntersects.length > 0) {
      switchToScene(3);
      return;
    }
  } else if(currentScene === 3){
    switchToScene(1);
  }
});

window.addEventListener('mousemove', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  
  let isHover = false;
  if(currentScene === 1){
    const veveIntersects = raycaster.intersectObject(veve, true);
    isHover = veveIntersects.length > 0;
  } else if(currentScene === 3){
    isHover = true;
  }
  
  canvas.style.cursor = isHover ? 'pointer' : 'default';
});

// ===== СТАТИЧЕСКИЕ ОБЪЕКТЫ =====
[floor, afroBase].forEach(o=>{
  if(o && o.matrixAutoUpdate !== undefined){o.matrixAutoUpdate=false;o.updateMatrix();}});

// ===== АНИМАЦИЯ =====
const clock=new THREE.Clock();
const prof={squatDepth:0.04,squatSpeed:1.1,hipSwayAmp:0.02,hipSwaySpeed:0.8,hipBounceAmp:0.01,hipBounceSpeed:1.2,armFlowAmp:0.9,armFlowSpeed:0.7,armRhythmAmp:0.6,armRhythmSpeed:1.8,bodyWaveAmp:0.04,bodyWaveSpeed:0.6,bodyRotAmp:0.03,bodyRotSpeed:0.5,headNodAmp:0.03,headTiltAmp:0.02,phaseOffset:0.0,smoothness:0.8};
const vdp={armHome:{l:{pos:armMeshL.position.clone(),rot:armMeshL.rotation.clone()},r:{pos:armMeshR.position.clone(),rot:armMeshR.rotation.clone()}},handHome:{l:{pos:handL.position.clone(),rot:handL.rotation.clone()},r:{pos:handR.position.clone(),rot:handR.rotation.clone()}},pivotL:new THREE.Vector3(-0.06,1.26+ARM_Y,0.0),pivotR:new THREE.Vector3(0.06,1.26+ARM_Y,0.0)};
const smoothState={kneeBend:0,lArmRotX:-1.0,lArmRotZ:0,rArmRotX:-1.0,rArmRotZ:0,sway:0,bodyRot:0,gluteMove:0,gluteBounce:0,hipBounce:0,headNod:0,headTilt:0};
const _tmpV=new THREE.Vector3();

function rotateArmAroundPivot(meshObj,pivot,rx,rz){
  const e=new THREE.Euler(rx,0,rz,'XYZ'),R=new THREE.Matrix4().makeRotationFromEuler(e);
  _tmpV.copy(pivot).applyMatrix4(R);meshObj.position.set(pivot.x-_tmpV.x,pivot.y-_tmpV.y,pivot.z-_tmpV.z);meshObj.rotation.set(rx,0,rz);}
function placeHandLeft(hand,homePos,pivot,rx,rz){
  const e=new THREE.Euler(rx,0,rz,'XYZ'),R=new THREE.Matrix4().makeRotationFromEuler(e);
  _tmpV.copy(homePos).sub(pivot).applyMatrix4(R).add(pivot);hand.position.copy(_tmpV);hand.rotation.set(-Math.PI/2,Math.PI,0);}
function placeHandRight(hand,homePos,pivot,rx,rz){
  const e=new THREE.Euler(rx,0,rz,'XYZ'),R=new THREE.Matrix4().makeRotationFromEuler(e);
  _tmpV.copy(homePos).sub(pivot).applyMatrix4(R).add(pivot);hand.position.copy(_tmpV);hand.rotation.set(-Math.PI/2,0,0);}

const _cm=new THREE.Matrix4(),_cq=new THREE.Quaternion(),_cv=new THREE.Vector3(),_cp=new THREE.Vector3();
let _fpsAcc=0,_fpsN=0,_fpsLast=0;const _DPR_CAP=Math.min(devicePixelRatio,1.25);
function autoQuality(dt,T){
  _fpsAcc+=1/Math.max(dt,1e-4);_fpsN++;
  if(T-_fpsLast<2||_fpsN<60)return;
  const avg=_fpsAcc/_fpsN,cur=renderer.getPixelRatio();
  if(avg<40)renderer.setPixelRatio(Math.max(0.85,cur-0.15));
  else if(avg>55)renderer.setPixelRatio(Math.min(_DPR_CAP,cur+0.1));
  _fpsAcc=0;_fpsN=0;_fpsLast=T;}

function frame(){
  const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  flameMat.uniforms.uTime.value=T;

  const t=T, DEPTH=1.2, GLUTE_AMP_MUL=0.6, SMOOTH=0.10, soft=prof.smoothness;
  const squatWave=Math.sin(t*prof.squatSpeed+prof.phaseOffset);
  const targetKneeBend=Math.max(0,squatWave)*prof.squatDepth*DEPTH*soft;
  const hipWave=Math.sin(t*prof.hipSwaySpeed+prof.phaseOffset*1.3);
  const targetSway=hipWave*prof.hipSwayAmp*DEPTH*soft;
  const bounceWave=Math.abs(Math.sin(t*prof.hipBounceSpeed+prof.phaseOffset*0.7));
  const targetHipBounce=bounceWave*prof.hipBounceAmp*DEPTH*soft;
  const flowArm=Math.sin(t*prof.armFlowSpeed+prof.phaseOffset);
  const rhythmRaw=Math.sin(t*prof.armRhythmSpeed+prof.phaseOffset*1.5);
  const rhythmArm=rhythmRaw*rhythmRaw*Math.sign(rhythmRaw)*0.4+rhythmRaw*0.6;
  const armFlow=flowArm*prof.armFlowAmp*soft, armRhythm=rhythmArm*prof.armRhythmAmp*soft;
  const armAsym=Math.sin(t*0.3+prof.phaseOffset)*0.15;
  const targetLArmX=-1.0+armFlow*0.5+armRhythm*0.3, targetLArmZ=(armFlow*0.6+armRhythm*0.2)*(1+armAsym);
  const targetRArmX=-1.0-armFlow*0.5-armRhythm*0.3, targetRArmZ=-(armFlow*0.6+armRhythm*0.2)*(1-armAsym);
  const targetBodyRot=Math.sin(t*prof.bodyRotSpeed+prof.phaseOffset*0.5)*prof.bodyRotAmp*DEPTH*soft;
  const bodyWave=Math.sin(t*prof.bodyWaveSpeed+prof.phaseOffset*2.0)*prof.bodyWaveAmp*DEPTH*soft;
  const targetGluteMove=Math.sin(t*prof.hipSwaySpeed*2.0+prof.phaseOffset)*prof.hipSwayAmp*1.8*DEPTH*GLUTE_AMP_MUL*soft;
  const targetGluteBounce=bounceWave*prof.hipBounceAmp*DEPTH*GLUTE_AMP_MUL*soft;
  const targetHeadNod=Math.sin(t*prof.bodyWaveSpeed*1.3+1.0)*prof.headNodAmp*soft;
  const targetHeadTilt=Math.sin(t*prof.hipSwaySpeed*0.8)*prof.headTiltAmp*soft;

  const lerpF=Math.min(1,dt*15*SMOOTH*4*soft);
  smoothState.kneeBend+=(targetKneeBend-smoothState.kneeBend)*lerpF;
  smoothState.lArmRotX+=(targetLArmX-smoothState.lArmRotX)*lerpF;
  smoothState.lArmRotZ+=(targetLArmZ-smoothState.lArmRotZ)*lerpF;
  smoothState.rArmRotX+=(targetRArmX-smoothState.rArmRotX)*lerpF;
  smoothState.rArmRotZ+=(targetRArmZ-smoothState.rArmRotZ)*lerpF;
  smoothState.sway+=(targetSway-smoothState.sway)*lerpF;
  smoothState.bodyRot+=(targetBodyRot-smoothState.bodyRot)*lerpF;
  smoothState.gluteMove+=(targetGluteMove-smoothState.gluteMove)*lerpF;
  smoothState.gluteBounce+=(targetGluteBounce-smoothState.gluteBounce)*lerpF;
  smoothState.hipBounce+=(targetHipBounce-smoothState.hipBounce)*lerpF;
  smoothState.headNod+=(targetHeadNod-smoothState.headNod)*lerpF;
  smoothState.headTilt+=(targetHeadTilt-smoothState.headTilt)*lerpF;

  const kneeBend=smoothState.kneeBend;
  kneeL.rotation.x=kneeBend;kneeR.rotation.x=kneeBend;
  const legLen=0.83, dy=legLen*(1-Math.cos(kneeBend));
  hipL.position.set(-0.095,0.72+dy,0);hipR.position.set(0.095,0.72+dy,0);
  hipL.rotation.x=-kneeBend*0.5;hipR.rotation.x=-kneeBend*0.5;

  bodyGroup.position.x=smoothState.sway;
  bodyGroup.position.y=smoothState.hipBounce*0.5+smoothState.gluteBounce*0.3+bodyWave*0.4;
  bodyGroup.rotation.z=smoothState.sway*2.0;bodyGroup.rotation.y=smoothState.bodyRot;

  headGroup.position.y=HEAD_BASE_Y/0.9;
  headGroup.rotation.x=smoothState.headNod;headGroup.rotation.z=-smoothState.bodyRot*0.5;headGroup.rotation.y=smoothState.headTilt;

  rotateArmAroundPivot(armMeshL,vdp.pivotL,smoothState.lArmRotX,smoothState.lArmRotZ);
  rotateArmAroundPivot(armMeshR,vdp.pivotR,smoothState.rArmRotX,smoothState.rArmRotZ);
  placeHandLeft(handL,vdp.handHome.l.pos,vdp.pivotL,smoothState.lArmRotX,smoothState.lArmRotZ);
  placeHandRight(handR,vdp.handHome.r.pos,vdp.pivotR,smoothState.rArmRotX,smoothState.rArmRotZ);

  const gluteFreq=0.382, gluteAmp=0.015, gluteOsc=Math.sin(T*2*Math.PI*gluteFreq)*gluteAmp;
  gluteL.position.y=GLUTE_BASE_Y+dy+gluteOsc;gluteR.position.y=GLUTE_BASE_Y+dy+gluteOsc;
  gluteL.scale.z=1.15+smoothState.gluteMove+smoothState.gluteBounce;
  gluteR.scale.z=1.15-smoothState.gluteMove+smoothState.gluteBounce;

  if(scene1Group.visible){
    for(let i=0;i<CANDLES;i++){
      const c=candleData[i];
      _cv.set(1,c.ht,1);_cp.set(c.x,c.ht/2,c.z);_cm.compose(_cp,_cq,_cv);candleBodies.setMatrixAt(i,_cm);
      const s=.88+.16*Math.sin(T*12.3+i*2.7)+.07*Math.sin(T*23.1+i);
      const sy=s*(1+.10*Math.sin(T*7+i));
      _cv.set(s,sy,s);_cp.set(c.x,c.ht+.034+(sy-1)*.034,c.z);_cm.compose(_cp,_cq,_cv);candleFlames.setMatrixAt(i,_cm);
      flameHalos.children[i].position.set(c.x,c.ht+.04,c.z);}
    candleBodies.instanceMatrix.needsUpdate=true;
    candleFlames.instanceMatrix.needsUpdate=true;

    candleLight.intensity=5*(.80+.20*Math.sin(T*8.4)+.08*Math.sin(T*17.1));
    veve.rotation.z=T*.045;
    veve.material.opacity=.85*(.86+.14*Math.sin(T*1.7));
  }

  if(scene3Group.visible){
    spores.forEach(sp=>{
      sp.s.position.y = sp.baseY + Math.sin(T * sp.sp + sp.ph) * 0.5;
      sp.s.material.opacity = 0.3 + 0.4 * Math.sin(T * 0.6 + sp.ph);
      sp.s.material.rotation += dt * 0.15;
    });
    mushrooms3.forEach((m,i)=>{
      m.scale.y = 1 + 0.05 * Math.sin(T * 0.3 + i);
    });
    mushroomLights.forEach((l,i)=>{
      l.intensity = 2 + Math.sin(T * 0.4 + i) * 1;
    });
  }

  autoQuality(dt,T);
  controls.update();
  composer.render();
  requestAnimationFrame(frame);}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth>>2,innerHeight>>2);});

frame();
</script>
