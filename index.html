function updateVoodoo(d,timeOfDay){
if(!voodooGroup)return;
const isMorning=gt>=0&&gt<30/180;const isDay=gt>=30/180&&gt<45/180;const isEvening=gt>=45/180&&gt<90/180;const isNight=gt>=90/180;
const isDancing=isNight||((isMorning||isDay||isEvening)&&radioPlaying&&!radioManualOverride&&radioHeavyweight&&radioHeavyweight.volume>0.01);
voodooGroup.visible=true;
// Ночью стоит на приподнятом белом полу домика
if(isNight){voodooGroup.position.set(HUT_X,FLOOR_Y+0.05757,HUT_Z+2.5);voodooGroup.rotation.set(0,0,0);}
else{voodooGroup.position.set(0,0.05757,0);voodooGroup.rotation.set(0,0,0);}
if(voodooLocalLight){voodooLocalLight.visible=true;voodooLocalLight.intensity=2.0}
if(eveningSunLight){eveningSunLight.visible=false;eveningSunLight.intensity=0;}
if(voodooGroup&&isDancing){
const elapsed=performance.now()*.001*0.4;
const t=isNight?elapsed*1.2:elapsed*0.4;
const armT=elapsed*0.2;
const bassN=Math.abs(Math.sin(elapsed*2*Math.PI));const midN=Math.abs(Math.sin(elapsed*1*Math.PI));
const squat=isNight?Math.abs(Math.sin(t*2.4))*0.08:Math.abs(Math.sin(t*2))*0.08*bassN;
const sway=isNight?Math.sin(t*2.4)*0.02:0;
let lArmRotX=-0.1,lArmRotZ=0.15,rArmRotX=-0.1,rArmRotZ=-0.15,lElbowRotX=-0.2,rElbowRotX=-0.2,lLegRotZ=0.05,rLegRotZ=-0.05;
const armWave=Math.sin(armT*2.5);
lArmRotX=-1.0+armWave*0.4*midN;lArmRotZ=0.6*armWave;rArmRotX=-1.0-armWave*0.4*midN;rArmRotZ=-0.6*armWave;
lElbowRotX=-0.4-Math.abs(armWave)*0.3*bassN;rElbowRotX=-0.4-Math.abs(armWave)*0.3*bassN;
lLegRotZ=isNight?0.1+Math.sin(t*6)*0.15:0.1+Math.sin(t*2)*0.15*bassN;
rLegRotZ=isNight?-0.1-Math.sin(t*6+Math.PI)*0.15:-0.1-Math.sin(t*2+Math.PI)*0.15*bassN;
if(voodooParts.body){voodooParts.body.position.y=-squat;voodooParts.body.position.z=sway;}
if(voodooParts.head){voodooParts.head.rotation.x=armWave*0.15*midN;voodooParts.head.rotation.z=-armWave*0.1*midN}
if(voodooParts.lArm){voodooParts.lArm.rotation.x=lArmRotX;voodooParts.lArm.rotation.z=lArmRotZ}
if(voodooParts.rArm){voodooParts.rArm.rotation.x=rArmRotX;voodooParts.rArm.rotation.z=rArmRotZ}
if(voodooParts.lElbow)voodooParts.lElbow.rotation.x=lElbowRotX;
if(voodooParts.rElbow)voodooParts.rElbow.rotation.x=rElbowRotX;
if(voodooParts.lLeg)voodooParts.lLeg.rotation.z=lLegRotZ;
if(voodooParts.rLeg)voodooParts.rLeg.rotation.z=rLegRotZ;
if(voodooParts.lKnee)voodooParts.lKnee.rotation.x=isNight?Math.abs(Math.sin(t*6))*0.4+squat:Math.abs(Math.sin(t*2))*0.4+squat;
if(voodooParts.rKnee)voodooParts.rKnee.rotation.x=isNight?Math.abs(Math.sin(t*6+Math.PI))*0.4+squat:Math.abs(Math.sin(t*2+Math.PI))*0.4+squat;
if(voodooParts.gluteL&&voodooParts.gluteR){
const gluteMove=Math.sin(t*5.4)*(isNight?0.015:0.1);
const gluteBounce=Math.abs(Math.sin(t*7.5))*(isNight?0.02:0.08);
voodooParts.gluteL.scale.z=1.15+gluteMove+gluteBounce;
voodooParts.gluteR.scale.z=1.15-gluteMove+gluteBounce;
}
}}

function buildCrocGrid(){
crocGrid.clear();
for(let i=0;i<en.length;i++){
const e=en[i];
if(!e||!e.mesh)continue;
const gx=Math.floor(e.mesh.position.x/CROC_GRID_SIZE);
const gz=Math.floor(e.mesh.position.z/CROC_GRID_SIZE);
const key=gx+'_'+gz;
if(!crocGrid.has(key))crocGrid.set(key,[]);
crocGrid.get(key).push(e);
}
}
function getNearbyCrocs(x,z,radius){
const result=[];
const gx=Math.floor(x/CROC_GRID_SIZE);
const gz=Math.floor(z/CROC_GRID_SIZE);
const r=Math.ceil(radius/CROC_GRID_SIZE);
for(let dx=-r;dx<=r;dx++){
for(let dz=-r;dz<=r;dz++){
const key=(gx+dx)+'_'+(gz+dz);
const bucket=crocGrid.get(key);
if(bucket){
for(let i=0;i<bucket.length;i++)result.push(bucket[i]);
}
}
}
return result;
}
function upd(d){
if(pl.d)return;
const tvLookSpeed=2.0;
if(tvKeys.left)yaw+=tvLookSpeed*d;if(tvKeys.right)yaw-=tvLookSpeed*d;if(tvKeys.up)pitch+=tvLookSpeed*d;if(tvKeys.down)pitch-=tvLookSpeed*d;

uDN(d);updateAmbient(d);updateFlies(d);updateVoodoo(d,gt);
updateHutAndFire(d);
colaBottles.forEach(b=>{if(!b.userData.c){b.rotation.y+=d*0.8;b.position.y=0+Math.sin(performance.now()*0.002)*0.1;}});

for(let i=corpses.length-1;i>=0;i--){if(currentDay>corpses[i].userData.spawnDay){if(corpses[i].userData.flies)scn.remove(corpses[i].userData.flies);scn.remove(corpses[i]);corpses.splice(i,1)}}
const isNight=gt>=90/180;
if(isNight&&en.length<3)sCr();
if(!isNight&&en.length>0){en.forEach(e=>scn.remove(e.mesh));en=[]}
buildCrocGrid();
const wallR=4.7*1.5;
const doorOffset=wallR-0.12;
const doorWX=HUT_X-doorOffset;
const doorWZ=HUT_Z;
const dx=cam.position.x-HUT_X;
const dz=cam.position.z-HUT_Z;
const dist=Math.sqrt(dx*dx+dz*dz);
const distToDoor=Math.sqrt((cam.position.x-doorWX)**2+(cam.position.z-doorWZ)**2);
if(prevDistToHut>=wallR&&dist<wallR&&distToDoor<3.5){sfxDoor();}
else if(prevDistToHut<wallR&&dist>=wallR&&distToDoor<3.5){sfxDoor();}
prevDistToHut=dist;
if(dist>wallR-0.6&&dist<wallR+1.6){
if(distToDoor>3.5){
if(dist<wallR){const angle=Math.atan2(dz,dx);cam.position.x=HUT_X+Math.cos(angle)*(wallR-0.6);cam.position.z=HUT_Z+Math.sin(angle)*(wallR-0.6);}
else{const angle=Math.atan2(dz,dx);cam.position.x=HUT_X+Math.cos(angle)*(wallR+1.6);cam.position.z=HUT_Z+Math.sin(angle)*(wallR+1.6);}
}}
if(!isStopped){_forwardVec.set(0,0,-1).applyAxisAngle(_upVec,yaw);cam.position.addScaledVector(_forwardVec,C.mv*d)}
cam.position.y=2+Math.sin(performance.now()*.003)*.005;
if(gn)gn.position.y=-.35+Math.sin(performance.now()*.003)*.005;
if(shakeIntensity>0.001){cam.position.x+=(Math.random()-0.5)*shakeIntensity;cam.position.y+=(Math.random()-0.5)*shakeIntensity;shakeIntensity*=0.85;}else{shakeIntensity=0;}
if(sl.shadow){sl.shadow.camera.position.x=cam.position.x;sl.shadow.camera.position.z=cam.position.z;sl.shadow.camera.updateProjectionMatrix();}
const dc=Math.sqrt(cam.position.x**2+cam.position.z**2);
if(dc>C.ms/2-2){const a=Math.atan2(cam.position.z,cam.position.x);cam.position.x=Math.cos(a)*(C.ms/2-2);cam.position.z=Math.sin(a)*(C.ms/2-2)}
// ВОССТАНОВЛЕНО: золото ×2 (GOLD_MULT)
cr.forEach(c=>{if(!c.userData.c&&cam.position.distanceTo(c.position)<2){c.userData.c=true;c.visible=false;if(c.userData.t==='gold'){pl.g+=c.userData.ga*GOLD_MULT;sM('pickup-msg','+'+(c.userData.ga*GOLD_MULT)+' <span class="scl-gold">ЗОЛОТО</span>');sfxGold();saveGoldProgressThrottled()}else{pl.a+=c.userData.ga;sM('pickup-msg','+'+c.userData.ga+' <span class="scl-ammo">ПАТРОНЫ</span>');sfxAmmo()}uH()}});
for(let i=colaBottles.length-1;i>=0;i--){const b=colaBottles[i];if(!b.userData.c&&cam.position.distanceTo(b.position)<2){b.userData.c=true;b.visible=false;const healAmount=b.userData.healAmount;const oldHp=pl.hp;pl.hp=Math.min(100,pl.hp+healAmount);const actualHeal=Math.floor(pl.hp-oldHp);sM('pickup-msg','+'+actualHeal+'% <span class="scl-heal">CROCO-COLA</span>');sfxDrink();vkTapticFeedback('medium');scn.remove(b);colaBottles.splice(i,1);uH();}}
for(let i=0;i<bulletPool.length;i++){const b=bulletPool[i];if(!b.userData.active)continue;b.position.addScaledVector(b.userData.v,d);b.userData.l-=d;let hit=false;
const nearby=getNearbyCrocs(b.position.x,b.position.z,3);
for(let j=0;j<nearby.length;j++){
const e=nearby[j];
const ddx=b.position.x-e.mesh.position.x,ddy=b.position.y-e.mesh.position.y,ddz=b.position.z-e.mesh.position.z;
if(ddx*ddx+ddy*ddy+ddz*ddz<1.44){
const idx=en.indexOf(e);
if(idx>=0){killCroc(idx);hit=true;break;}
}
}
if(hit||b.userData.l<=0){releaseBullet(b);}}
en.forEach(e=>{
e.wp+=d*e.sp;
e.lg.forEach((l,i)=>l.rotation.x=Math.sin(e.wp+i*Math.PI/2)*.4);
_tempVec.subVectors(cam.position,e.mesh.position);
_tempVec.y=0;
const ds=_tempVec.length();
if(ds>1.2){
_tempVec.normalize();
let nextX=e.mesh.position.x+_tempVec.x*e.sp*d;

let nextDistToHut=Math.sqrt((nextX-HUT_X)**2+(nextZ-HUT_Z)**2);
if(nextDistToHut<14){
const angle=Math.atan2(nextZ-HUT_Z,nextX-HUT_X);

const dot=_tempVec.x*tangentX+_tempVec.z*tangentZ;
nextX=HUT_X+Math.cos(angle)*14+tangentX*dot*e.sp*d+(Math.cos(angle)*0.1);

}
e.mesh.position.x=nextX;
e.mesh.position.z=nextZ;
e.mesh.lookAt(cam.position.x,e.mesh.position.y,cam.position.z);
}else{
pl.hp-=15*d;

vkTapticFeedback('heavy');

}
});
