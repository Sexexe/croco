<style>

:root{--hud-bg:linear-gradient(to bottom,rgba(244,228,188,.92),rgba(232,213,163,.92));--hud-border:#8b5a2b;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#1a120b}
body{font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;z-index:10}
#hud-top{padding:10px 15px;margin-top:7mm;display:flex;justify-content:space-between;align-items:flex-start;gap:15px;width:100%}
.hud-panel{background:var(--hud-bg);border:2px solid var(--hud-border);border-radius:6px;padding:10px 8px;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 15px rgba(92,58,30,.15);position:relative;flex:1;max-width:140px;min-width:110px;text-align:center;transition:background .5s ease,border-color .5s ease}
.hud-panel::before{content:'';position:absolute;top:2px;left:2px;right:2px;bottom:2px;border:1px dashed rgba(139,90,43,.4);pointer-events:none;border-radius:4px}
.hud-row{display:flex;align-items:center;justify-content:center;gap:6px;margin:3px 0;font-family:'Rye',serif;font-size:15px;line-height:1.3}
.hud-label{font-size:17px;line-height:1}.hud-value{font-weight:800;font-size:17px}
.hp-val{color:#8b0000}.gold-val{color:#8b6914;font-size:16px}.ammo-val{color:#3a2010}.day-val{color:#5c3a1e}.kill-val{color:#8b0000}.time-val{color:#5c3a1e;font-size:12px}
.ammo-container{display:flex;align-items:center;justify-content:center;gap:6px}
.ammo-icon{display:flex;gap:2px;align-items:flex-end;height:16px}
.bullet{width:5px;height:16px;background:linear-gradient(to bottom,#ffd700 25%,#b8860b 25%,#b8860b 100%);border-radius:2px 2px 1px 1px;border:1px solid #8b6914;box-shadow:0 0 3px rgba(255,215,0,.3)}
@media(max-width:800px){.hud-panel{transform:translateY(43%);max-width:107px;min-width:84px;min-height:82px;max-height:82px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 4px}.hud-row{margin:2px 0;min-height:20px;height:20px;font-size:13px}.hud-label{font-size:14px}.hud-value{font-size:14px}.day-val{font-size:13px}.gold-val{font-size:13px}.ammo-icon{height:12px}.bullet{width:4px;height:12px}}
@media(max-width:800px){body.iphone .hud-panel{transform:translateY(76%)}}
#crosshair{position:absolute;top:50%;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);pointer-events:none;border:1.5px solid #fff;border-radius:50%;opacity:.95;box-shadow:0 0 4px rgba(0,0,0,.6);transition:transform .1s ease-out,border-color .1s ease-out,box-shadow .1s ease-out; display:none;} /* PATCH: Hidden by default */
#crosshair.shooting{transform:translate(-50%,-50%) scale(1.4)}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff}
#crosshair::before{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-50%)}
#crosshair::after{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%)}
#pickup-msg{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-weight:900;text-shadow:2px 2px 0 #000,0 0 10px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;color:#ffb703;font-size:28px;font-family:'Rye',serif}
.scl-heal{color:#00ff88!important}.scl-gold{color:#ffd700!important}.scl-ammo{color:#ffb703!important}
.menu-btn{position:absolute;bottom:calc(115px + env(safe-area-inset-bottom));left:30px;width:60px;height:60px;border-radius:50%;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:15;box-shadow:0 4px 15px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,0.25);transition:all .2s;background:rgba(92,58,30,0.5)}
.menu-btn:active{transform:scale(.9);background:rgba(139,0,0,0.6)}
.move-btn{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:115px;width:70px;height:70px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(5px);cursor:pointer;-webkit-tap-highlight-color:transparent;text-transform:uppercase;letter-spacing:.5px;z-index:15;font-family:'Open Sans',Arial,sans-serif;box-shadow:0 4px 15px rgba(0,0,0,.5);border:3px solid #8b5a2b;transition:all .2s;touch-action:manipulation}
.move-btn.go{background:rgba(0,139,0,.5)}.move-btn.stop{background:rgba(139,0,0,.4)}.move-btn:active{transform:scale(.9)}
.music-btn{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:30px;width:70px;height:70px;border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(5px);cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:15;box-shadow:0 4px 15px rgba(0,0,0,.5);border:3px solid #8b5a2b;transition:all .2s;background:rgba(92,58,30,.6);touch-action:manipulation}
.music-btn.playing{background:rgba(0,139,0,.6);border-color:#4caf50;animation:pulse 1.5s infinite}.music-btn:active{transform:scale(.9)}
@keyframes pulse{0%,100%{box-shadow:0 4px 15px rgba(0,0,0,.5)}50%{box-shadow:0 4px 25px rgba(76,175,80,.6)}}
.poster-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:#1a120b;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;z-index:30;padding:0;box-sizing:border-box;text-align:center;overflow:hidden}
.loading-background{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:34}
.loading-container{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:80%;max-width:300px;height:12px;background:rgba(0,0,0,0.4);border-radius:6px;overflow:hidden;border:1px solid #8b5a2b;box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);z-index:35}
.loading-bar{width:0%;height:100%;background:linear-gradient(90deg,#ff0000,#cc0000);box-shadow:0 0 10px #ff0000;transition:width .2s ease-out}
#startBtn{position:absolute;bottom:max(40px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-family:'Rye',serif;padding:15px 60px;font-size:clamp(18px,3vw,26px);background:linear-gradient(to bottom,#5c3a1e,#3a2010);border:3px solid #8b5a2b;color:#f4e4bc;cursor:pointer;text-transform:uppercase;letter-spacing:3px;box-shadow:0 4px 15px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:35}
#startBtn:hover:not(.btn-disabled){background:linear-gradient(to bottom,#6b4423,#4a2a15);transform:translateX(-50%) translateY(-2px)}
#startBtn:active:not(.btn-disabled){transform:translateX(-50%) translateY(1px)}
#startBtn.btn-disabled{background:linear-gradient(to bottom,#444,#222)!important;cursor:not-allowed!important;opacity:.6!important;border-color:#555!important;color:#888!important;pointer-events:none!important;box-shadow:none!important}
#overlay{display:flex}#win-screen,#lose-screen{display:none}
.wanted-poster{background:linear-gradient(to bottom,#f4e4bc,#e8d5a3,#f4e4bc);border:4px double #5c3a1e;padding:30px 40px;max-width:500px;width:90%;text-align:center;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.8),inset 0 0 60px rgba(92,58,30,.2);transform:rotate(-1deg);display:flex;flex-direction:column;align-items:center;z-index:40}
.wanted-poster::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:2px solid #8b5a2b;pointer-events:none}
.main-title{font-family:'Rye',serif;color:#8b0000;font-size:clamp(32px,6vw,54px);margin:0 0 15px 0;text-transform:uppercase;letter-spacing:4px;text-shadow:2px 2px 0 rgba(0,0,0,.2);line-height:1.1;text-align:center}
.cowboy-btn{font-family:'Rye',serif;padding:15px 40px;font-size:clamp(18px,3vw,26px);background:linear-gradient(to bottom,#5c3a1e,#3a2010);border:3px solid #8b5a2b;color:#f4e4bc;cursor:pointer;text-transform:uppercase;letter-spacing:3px;box-shadow:0 4px 15px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:10px 0}
.cowboy-btn:hover:not(.btn-disabled){background:linear-gradient(to bottom,#6b4423,#4a2a15);transform:translateY(-2px)}.cowboy-btn:active:not(.btn-disabled){transform:translateY(1px)}
.cowboy-btn.btn-disabled{background:linear-gradient(to bottom,#444,#222)!important;cursor:not-allowed!important;opacity:.6!important;border-color:#555!important;color:#888!important;pointer-events:none!important;box-shadow:none!important}
#mission-success-screen{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:auto;overflow:hidden}

.mission-success-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:80px}
.play-btn{font-family:'Rye',serif;padding:18px 70px;font-size:clamp(20px,3.5vw,30px);background:linear-gradient(to bottom,#5c3a1e,#3a2010);border:3px solid #8b5a2b;color:#f4e4bc;cursor:pointer;text-transform:uppercase;letter-spacing:3px;box-shadow:0 6px 20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:52}
.play-btn:hover:not(.btn-disabled){background:linear-gradient(to bottom,#6b4423,#4a2a15);transform:translateY(-3px)}.play-btn:active:not(.btn-disabled){transform:translateY(1px)}
.play-btn.btn-disabled{background:linear-gradient(to bottom,#444,#222)!important;cursor:not-allowed!important;opacity:.6!important;border-color:#555!important;color:#888!important;pointer-events:none!important;box-shadow:none!important}
.reward-hint{margin-top:15px;font-family:'Rye',serif;font-size:clamp(12px,2vw,16px);color:#f4e4bc;opacity:.85;text-shadow:1px 1px 2px rgba(0,0,0,.6);letter-spacing:1px}
.cheat-hint{margin-top:20px;font-family:monospace;font-size:10px;color:#f4e4bc;opacity:.5;text-shadow:1px 1px 2px rgba(0,0,0,.8);letter-spacing:.5px;text-align:center;line-height:1.5}
#video-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:#000;pointer-events:auto}
#intro-video{width:100%;height:100%;object-fit:cover}
#cheat-msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,0.9);color:#fff;padding:10px 20px;border-radius:5px;font-family:monospace;font-size:14px;z-index:9999;display:none;pointer-events:none}

#splash-arc .letter{position:absolute;top:0;font-family:'Rye',serif;font-weight:400;font-size:clamp(34px,7vw,84px);line-height:1;color:#ffffff;transform-origin:50% 100%;white-space:nowrap;text-shadow:none;}

function __crocAddMainRocksToSmallIsland(center, s){

        const g = new THREE.DodecahedronGeometry(1, 0);
        const p = g.attributes.position;

            const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
            const n = Math.sin(x*3.1 + z*2.7) * 0.12 + Math.cos(y*4.3 + x*1.9) * 0.08;

        return g;
    }

        let valid = false;
        let attempts = 0;

            attempts++;
            const a = Math.random() * Math.PI * 2;
            const outer = beachOuterRadius(a) * s;
            
            // === DISTANCE LOGIC ===
            let distOffset;
            let yPos;
            let size;
            
            if (sizeClass === 'large') {
                // Крупные: ДАЛЕКО (15 .. 30 метров от берега)
                distOffset = 15 + Math.random() * 15;
                yPos = -1.5 - Math.random() * 1.5; // Глубоко
                size = (2.5 + Math.random()) * 1.5;
            } else if (sizeClass === 'med') {
                // Средние: СРЕДНЕ (8 .. 15 метров)
                distOffset = 8 + Math.random() * 7;
                yPos = -0.8 - Math.random() * 1.0;
                size = (1.2 + Math.random() * 0.8) * 1.2;
            } else {
                // Мелкие: БЛИЗКО К ТРАВЕ (2 .. 8 метров)
                distOffset = 2 + Math.random() * 6;
                yPos = -0.3 - Math.random() * 0.5; // Мелководье
                size = (0.5 + Math.random() * 0.5) * 1.2;
            }
            
            const dist = outer + distOffset;
            const x = center.x + Math.cos(a) * dist;
            const z = center.z + Math.sin(a) * dist;
            
            // Проверка на дорожку
            if (typeof isOnEastPath === 'function' && isOnEastPath(x, z)) continue;
            
            const geo = makeRockGeo();
            const mesh = new THREE.Mesh(geo, rockMat);
            
            mesh.position.set(x, yPos, z);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI*2, Math.random()*Math.PI);
            mesh.scale.set(
                size * (0.9 + Math.random() * 0.3),
                size * (0.7 + Math.random() * 0.6),

            // Коллизии для крупных камней
            if (sizeClass === 'large' && typeof obstacleColliders !== "undefined") {
                obstacleColliders.push({x:x, z:z, r:Math.max(0.4, size * 0.85)});
            }
            
            valid = true;
        }
    }

    // Спавним по количеству: 5 средних, 5 малых, 2 крупных

    for(let i=0; i<5; i++) placeRock('med');
    for(let i=0; i<5; i++) placeRock('small');
}

function halfWidthAtHeightBoat(pointFn, t, y, p = BOAT_P) {
const top = pointFn(0, t, p);
const bottom = pointFn(0.5, t, p);
if (y >= top.y) return Math.abs(top.x);
if (y <= bottom.y) return 0;
const steps = 96;

for (let i = 1; i <= steps; i++) {
const u = 0.5 * (i / steps);

const x = THREE.MathUtils.lerp(prev.x, cur.x, f);

const obstGrid = new Map();

function rebuildObstacleGrid() {

const o = obstacleColliders[i];

function softResolveObstacleCollision(pos, radius, strength) {
if (!obstacleColliders.length) return;

const k = (strength == null) ? 0.5 : strength;
const gx = Math.floor(pos.x / OBST_GRID);

for (let dx = -1; dx <= 1; dx++) {
for (let dz = -1; dz <= 1; dz++) {
const bucket = obstGrid.get((gx + dx) + '_' + (gz + dz));
if (!bucket) continue;
for (let i = 0; i < bucket.length; i++) {
const o = bucket[i];
const ddx = pos.x - o.x;
const ddz = pos.z - o.z;
const rr = radius + (o.r || 1.0);
const distSq = ddx * ddx + ddz * ddz;
if (distSq < rr * rr) {

const dist = Math.sqrt(distSq);
const overlap = rr - dist;
const push = Math.min(overlap, Math.max(0.015, overlap * k));
pos.x += (ddx / dist) * push;
pos.z += (ddz / dist) * push;
}
}
}
}
}
function resolveObstacleCollision(pos, radius) {
if (!obstacleColliders.length) return;

const gx = Math.floor(pos.x / OBST_GRID);
const gz = Math.floor(pos.z / OBST_GRID);
for (let dx = -1; dx <= 1; dx++) {
for (let dz = -1; dz <= 1; dz++) {
const bucket = obstGrid.get((gx + dx) + '_' + (gz + dz));
if (!bucket) continue;
for (let i = 0; i < bucket.length; i++) {
const o = bucket[i];
const ddx = pos.x - o.x;
const ddz = pos.z - o.z;
const rr = radius + o.r;
const distSq = ddx * ddx + ddz * ddz;
if (distSq < rr * rr) {

const dist = Math.sqrt(distSq);

pos.z += (ddz / dist) * overlap;
}
}
}

const second = points[1];
const dir0 = new THREE.Vector3(second.x - first.x, second.y - first.y, 0).normalize();
const lip = _magAdd(g, _magRbox(0.060, 0.013, 0.030, 0.0025), ribMat, first.x, first.y, 0);
lip.quaternion.setFromUnitVectors(up, dir0);
const last = points[points.length - 1];
const prev = points[points.length - 2];
const dirLast = new THREE.Vector3(last.x - prev.x, last.y - prev.y, 0).normalize();
const plate = _magAdd(g, _magRbox(0.064, 0.014, 0.033, 0.003), floorMat, last.x, last.y, 0);

function _akMakeTexture(size, drawFn) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  drawFn(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = _akMaxAniso;
  return t;
}

  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, s, s);

    const v = 128 + (Math.random() - 0.5) * 82;
    ctx.fillStyle = `rgba(${v},${v},${v},0.04)`;
    ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);

  for (let i = 0; i < 260; i++) {
    ctx.beginPath();
    ctx.strokeStyle = Math.random() > 0.5
      ? `rgba(255,255,255,${0.02 + Math.random() * 0.05})`
      : `rgba(0,0,0,${0.02 + Math.random() * 0.055})`;
    ctx.lineWidth = 0.35 + Math.random() * 1.2;
    const y = Math.random() * s;
    ctx.moveTo(0, y);
    ctx.lineTo(s, y + (Math.random() - 0.5) * 16);
    ctx.stroke();
  }
  for (let i = 0; i < 70; i++) {
    ctx.beginPath();
    ctx.strokeStyle = `rgba(18,18,18,${0.025 + Math.random() * 0.05})`;

    ctx.lineTo(x0 + (Math.random() - 0.5) * 160, y0 + (Math.random() - 0.5) * 35);
    ctx.stroke();
  }
});

  return new THREE.MeshPhysicalMaterial({

    roughness: o.roughness ?? 0.48,
    roughnessMap: tex,
    bumpMap: tex,
    bumpScale: o.bumpScale ?? (isMetal ? 0.00024 : 0.00052),

    opacity: o.opacity ?? 1.0,
    transmission: o.transmission ?? 0,
    thickness: o.thickness ?? 0,
    ior: o.ior ?? 1.45
  });
}

    if (i < points.length - 2) {
      const rib = _akAdd(g, _akRbox(0.060, 0.0045, 0.029, 0.0015), ribMat, p1.x, p1.y, 0);
      rib.quaternion.setFromUnitVectors(up, dir);
    }
  }
  const first = points[0];
  const second = points[1];
  const dir0 = new THREE.Vector3(second.x - first.x, second.y - first.y, 0).normalize();
  const lip = _akAdd(g, _akRbox(0.060, 0.013, 0.030, 0.0025), ribMat, first.x, first.y, 0);
  lip.quaternion.setFromUnitVectors(up, dir0);
  const last = points[points.length - 1];
  const prev = points[points.length - 2];
  const dirLast = new THREE.Vector3(last.x - prev.x, last.y - prev.y, 0).normalize();
  const plate = _akAdd(g, _akRbox(0.064, 0.014, 0.033, 0.003), floorMat, last.x, last.y, 0);
  plate.quaternion.setFromUnitVectors(up, dirLast);
  _akAdd(g, _akBox(0.018, 0.004, 0.003), AK_M.dark, first.x + 0.012, first.y - 0.018, 0.014);
  return g;
}

/* =====================================================================
   АК-12: METAL VERSION (FROM USER REQUEST)
   ===================================================================== */
let _ak12Mats = null;
function getAK12Mats() {
  if (_ak12Mats) return _ak12Mats;
  const isMobLocal = isMob;
  const scratchTex = (() => {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, size, size);
    const count = Math.floor(size * size * 0.12);
    for (let i = 0; i < count; i++) {
      const v = 128 + (Math.random() - 0.5) * 82;
      ctx.fillStyle = `rgba(${v},${v},${v},0.05)`;
      ctx.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  })();

  let gunEnvMap = null;
  if (rnd) {
    try {
        const pmremGen = new THREE.PMREMGenerator(rnd);
        gunEnvMap = pmremGen.fromScene(new RoomEnvironment(), 0.035).texture;
        pmremGen.dispose();
    } catch(e) { console.warn("EnvMap error", e); }
  }

  function pmat(color, o = {}) {
    return new THREE.MeshPhysicalMaterial({
      color,
      metalness: o.metalness ?? 1.0,
      roughness: o.roughness ?? 0.15,
      roughnessMap: scratchTex,
      bumpMap: scratchTex,
      bumpScale: o.bumpScale ?? 0.00015,
      clearcoat: o.clearcoat ?? 1.0,
      clearcoatRoughness: o.clearcoatRoughness ?? 0.12,
      envMap: gunEnvMap,
      envMapIntensity: o.envMapIntensity ?? 1.5,
      side: o.side ?? THREE.FrontSide
    });
  }

  _ak12Mats = {
    main:        pmat(0xe0e4e8, { metalness: 1.0, roughness: 0.10, clearcoat: 1.0, envMapIntensity: 1.6 }),
    dark:        pmat(0x5a6068, { metalness: 1.0, roughness: 0.22, clearcoat: 0.8, envMapIntensity: 1.4 }),
    rail:        pmat(0xd0d4d8, { metalness: 1.0, roughness: 0.12, clearcoat: 1.0, envMapIntensity: 1.6 }),
    polymer:     pmat(0x707880, { metalness: 1.0, roughness: 0.28, clearcoat: 0.6, envMapIntensity: 1.3 }),
    polymerDark: pmat(0x3a4048, { metalness: 1.0, roughness: 0.32, clearcoat: 0.5, envMapIntensity: 1.2 }),
    rubber:      pmat(0x2a2e32, { metalness: 0.9, roughness: 0.38, clearcoat: 0.3, envMapIntensity: 1.1 })
  };
  return _ak12Mats;
}

function ak12Add(parent, geo, mat, x, y, z, rx, ry, rz) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.rotation.set(rx || 0, ry || 0, rz || 0);
  parent.add(m);
  return m;
}

function ak12AddCylX(parent, r, len, mat, x, y, z, rt, rb, seg) {
  const geo = new THREE.CylinderGeometry(rt ?? r, rb ?? r, len, seg ?? 16);
  const m = ak12Add(parent, geo, mat, x, y, z);
  m.rotation.z = -Math.PI / 2;
  return m;
}

function ak12AddPin(parent, x, y, z, len, mat) {
  return ak12Add(parent, new THREE.CylinderGeometry(0.0028, 0.0028, len || 0.036, 8),
    mat, x, y, z, Math.PI / 2, 0, 0);
}

function ak12AddPicatinny(parent, x0, x1, y, z, mat, slotMat, width, height) {
  const len = x1 - x0;
  if (len <= 0.002) return;
  ak12Add(parent, new THREE.BoxGeometry(len, height, width), mat, (x0 + x1) / 2, y, z);
  const step = isMob ? 0.022 : 0.016;
  for (let x = x0 + 0.006; x < x1 - 0.004; x += step) {
    ak12Add(parent, new THREE.BoxGeometry(0.0032, height + 0.0016, width + 0.0018),
      slotMat, x, y + height * 0.18, z);
  }
}

function ak12AddMlokSlot(parent, x, r, angle, mat) {
  const y = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  return ak12Add(parent, new THREE.BoxGeometry(0.028, 0.0045, 0.0085),
    mat, x, y, z, angle, 0, 0);
}

function ak12CreateMagazine(points, mat, ribMat, floorMat, M) {
  const g = new THREE.Group();
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const dir = new THREE.Vector3(p1.x - p0.x, p1.y - p0.y, 0);
    const len = dir.length() * 1.06;
    dir.normalize();
    const mid = new THREE.Vector3((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, 0);
    const seg = ak12Add(g, new THREE.BoxGeometry(0.056, len, 0.026), mat, mid.x, mid.y, mid.z);
    seg.quaternion.setFromUnitVectors(up, dir);
    if (i < points.length - 2) {
      const rib = ak12Add(g, new THREE.BoxGeometry(0.060, 0.0045, 0.029), ribMat, p1.x, p1.y, 0);
      rib.quaternion.setFromUnitVectors(up, dir);
    }
  }
  const first = points[0];
  const second = points[1];
  const dir0 = new THREE.Vector3(second.x - first.x, second.y - first.y, 0).normalize();
  const lip = ak12Add(g, new THREE.BoxGeometry(0.060, 0.013, 0.030), ribMat, first.x, first.y, 0);
  lip.quaternion.setFromUnitVectors(up, dir0);
  const last = points[points.length - 1];
  const prev = points[points.length - 2];
  const dirLast = new THREE.Vector3(last.x - prev.x, last.y - prev.y, 0).normalize();
  const plate = ak12Add(g, new THREE.BoxGeometry(0.064, 0.014, 0.033), floorMat, last.x, last.y, 0);
  plate.quaternion.setFromUnitVectors(up, dirLast);
  ak12Add(g, new THREE.BoxGeometry(0.018, 0.004, 0.003), M.dark,
    first.x + 0.012, first.y - 0.018, 0.014);
  return g;
}

function spawnWorldAK12() {
  if (worldAK12 || ak12PickedUp) return;
  // Правый малый остров: angle = -PI/2
  const si = SMALL_ISLANDS.find(s => Math.abs(s.angle + Math.PI/2) < 0.1) || SMALL_ISLANDS[SMALL_ISLANDS.length-1];
  const center = getSmallIslandCenter(si);
  
  const akGroup = new THREE.Group();
  const akModel = buildAK12MetalWithMag();
  
  // Масштаб 1:1 для мировой модели
  akModel.rotation.y = Math.PI / 2;
  akModel.updateMatrixWorld(true);
  const bbox = new THREE.Box3().setFromObject(akModel);
  akModel.position.sub(bbox.getCenter(new THREE.Vector3()));
  akGroup.add(akModel);
  akGroup.scale.setScalar(2.5); // PATCHED: Size x2.5 
  
  // Позиция на вершине острова
  akGroup.position.set(center.x, 1.2, center.z);
  akGroup.rotation.y = Math.random() * Math.PI;
  
  // PATCH: Save exact pickup position independent of model center offset
  worldAK12PickupPos.copy(akGroup.position);
  
  scn.add(akGroup);
  worldAK12 = akGroup;
}

function checkAK12Pickup() {
if (window._ak12BlockUntil && performance.now() < window._ak12BlockUntil) return;
if (!worldAK12 || ak12PickedUp || !ia || pl.d) return;
  
  // PATCH: Check distance against saved ground position, not model center
  const distSq = cam.position.distanceToSquared(worldAK12PickupPos);
  
  // Дистанция подбора ~1.5м (увеличена для масштаба 3x)
  if (distSq < 2.25) {
    ak12PickedUp = true;
    scn.remove(worldAK12);
    worldAK12 = null;
    
    // Создаем автомат у игрока

    vkTapticFeedback('medium');
  }
}

function createAKRifle() {
  if (gn) return;
  const ak12 = buildAK12MetalWithMag();
  ak12.rotation.y = Math.PI / 2;
  ak12.updateMatrixWorld(true);
  const bbox = new THREE.Box3().setFromObject(ak12);
  const size = bbox.getSize(new THREE.Vector3());
  const center = bbox.getCenter(new THREE.Vector3());
  const targetLength = 0.70;
  const maxDim = Math.max(size.x, size.y, size.z);
  const scaleFactor = targetLength / maxDim;
  gn = new THREE.Group();
  gunParts = {
    muzzle: new THREE.Object3D(),
    ejection: new THREE.Object3D()
  };
  ak12.position.sub(center);
  gn.add(ak12);
  gn.scale.setScalar(scaleFactor);
  gunParts.muzzle.position.set(0.656, 0.012, 0);
  gunParts.ejection.position.set(0.04, 0.03, 0.015);
  ak12.add(gunParts.muzzle);
  ak12.add(gunParts.ejection);
  if (isMob) {
    gunBasePos.set(0.0870, -0.2780, -0.5920);
    gunBaseRot.set(-0.0090, 0.1380, 0.0580);
  } else {
    gunBasePos.set(0.1700, -0.2830, -0.5620);
    gunBaseRot.set(-0.0210, 0.0290, 0.0000);
  }
  gn.position.copy(gunBasePos);
  gn.rotation.copy(gunBaseRot);
  cam.add(gn);
  if (!cam.parent) scn.add(cam);
  gn.traverse(child => {
    if (child.isMesh) {
      child.castShadow = false;
      child.receiveShadow = false;
      child.frustumCulled = false;
    }
  });
}

            function spawnEggs() {

    const offsets = [
        {x: -0.4, z: -0.2, id: 0},

        {x:  0.0, z:  0.4, id: 2},

        scn.add(egg);
        eggMeshes.push(egg);

    if (smallCrocCount >= MAX_SMALL_CROCS) return;
    
    for (let i = 0; i < 5; i++) {
        const m = buildDetailedCrocodile();
        m.scale.setScalar(0.4); // Tiny
        m.position.copy(pos);
        m.position.x += (Math.random() - 0.5) * 2;
        m.position.z += (Math.random() - 0.5) * 2;
        m.rotation.y = Math.random() * Math.PI * 2;
        
        scn.add(m);
        const data = {
            mesh: m, 
            ...m.userData, 
            isSmall: true,
            sp: m.userData.sp * 1.5, // Faster
            dmg: 3 // 5x less than 15
        };
        en.push(data);
        smallCrocCount++;
    }
}

// Function to spawn big crocs from touched eggs
function spawnBigCrocsFromEggs(pos) {
    for (let i = 0; i < 5; i++) {
        const m = buildDetailedCrocodile();
        m.scale.setScalar(1.35);
        m.position.copy(pos);
        // Spread them out around island
        const ang = (i / 5) * Math.PI * 2;
        m.position.x += Math.cos(ang) * 3;
        m.position.z += Math.sin(ang) * 3;
        m.lookAt(pos);
        
        scn.add(m);
        en.push({mesh: m, ...m.userData, isSmall: false, fromEgg: true});
    }
}

const _origKillCroc = killCroc;
killCroc = function(j) {

    // but prompt says "from each egg 5 small come out when shot")
    // Assuming "shot" means killed.
    // To track which egg spawned it is hard, so let's assume ANY big croc death 
    // has chance or specifically those from eggs.
    // Prompt: "if you shoot them [the 5 big ones], 5 small come out of each egg".
    // This implies specific linkage. Since we don't have IDs, let's say:
    // If killed croc is BIG and near Egg Island -> Spawn Small.

function createExtraWaterRocks() {
    const baseGeo = new THREE.DodecahedronGeometry(1, 0);
    const pos = baseGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const n = Math.sin(x*3.1 + z*2.7) * 0.12 + Math.cos(y*4.3 + x*1.9) * 0.08;
        pos.setXYZ(i, x * (1 + n), y * (1 + n * 0.6), z * (1 + n));
    }
    baseGeo.computeVertexNormals();

    const rockMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.95, metalness: 0.0, flatShading: true });

    const totalRocks = islands.length * 12;
    
    const instancedRocks = new THREE.InstancedMesh(baseGeo, rockMat, totalRocks);
    instancedRocks.castShadow = false; 
    instancedRocks.receiveShadow = true;
    scn.add(instancedRocks);
    
    const dummy = new THREE.Object3D();
    const colorTmp = new THREE.Color();
    let idx = 0;

    islands.forEach(isl => {
        const placeRock = (sizeClass) => {
            let valid = false;
            let x, z, y, s;
            let attempts = 0;
            
            while(!valid && attempts < 50) {
                attempts++;
                const angle = Math.random() * Math.PI * 2;
                const shoreR = beachOuterRadius(angle) * isl.scale;
                
                // === ГЛАВНАЯ ФИШКА: РАЗМЕР ОПРЕДЕЛЯЕТ РАССТОЯНИЕ ===
                let distOffset;
                if (sizeClass === 'large') {
                    // Крупные: ДАЛЕКО (15 .. 30 метров от берега)
                    distOffset = 15 + Math.random() * 15;
                    y = -1.5 - Math.random() * 1.5; // Глубоко
                    s = (2.5 + Math.random()) * 1.5;
                } else if (sizeClass === 'med') {
                    // Средние: СРЕДНЕ (8 .. 15 метров)
                    distOffset = 8 + Math.random() * 7;
                    y = -0.8 - Math.random() * 1.0;
                    s = (1.2 + Math.random() * 0.8) * 1.2;
                } else {
                    // Мелкие: БЛИЗКО К ТРАВЕ (2 .. 8 метров)
                    distOffset = 2 + Math.random() * 6;
                    y = -0.3 - Math.random() * 0.5; // Мелководье
                    s = (0.5 + Math.random() * 0.5) * 1.2;
                }
                
                const dist = shoreR + distOffset;
                x = isl.x + Math.cos(angle) * dist;
                z = isl.z + Math.sin(angle) * dist;
                
                // Проверка на дорожку
                if (typeof isOnEastPath === 'function' && isOnEastPath(x, z)) continue;
                
                valid = true;
            }
            
            if (!valid) return;

            dummy.position.set(x, y, z);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI*2, Math.random()*Math.PI);
            dummy.scale.set(s * 0.9, s * 0.7, s * 0.9);
            dummy.updateMatrix();
            instancedRocks.setMatrixAt(idx, dummy.matrix);

            // Коллизии для крупных камней
            if (typeof obstacleColliders !== "undefined" && obstacleColliders) {
                obstacleColliders.push({ x: x, z: z, r: Math.max(0.5, s * 0.85) });
            }

            // Цвет
            const colors = [0xffffff];
            colorTmp.setHex(0xffffff);
            
            instancedRocks.setColorAt(idx, colorTmp);
            idx++;
        };

        for(let i=0; i<countPerType.large; i++) placeRock('large');
        for(let i=0; i<countPerType.med; i++) placeRock('med');
        for(let i=0; i<countPerType.small; i++) placeRock('small');
    });
    
    instancedRocks.count = idx; // Скрываем неиспользованные инстансы
    instancedRocks.instanceMatrix.needsUpdate = true;
    if (instancedRocks.instanceColor) instancedRocks.instanceColor.needsUpdate = true;
}
